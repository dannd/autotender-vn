[project]
name = "autotender-vn"
version = "0.2.0"
description = "Deep Learning tự động soạn thảo Hồ sơ mời thầu (E-HSMT) tại Việt Nam"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # --- GUI ---
    # streamlit 1.60.x có conflict với qdrant-client qua urllib3 — nới lỏng để uv giải quyết
    "streamlit>=1.40.0,<2.0",
    # --- Crawler ---
    "httpx==0.28.1",
    "selectolax==0.4.11",
    "playwright==1.62.0",
    # --- PDF/DOCX ingestion ---
    "pymupdf==1.28.0",
    "python-docx==1.2.0",
    # --- NLP / ML ---
    "torch==2.13.0",
    "transformers==5.14.1",
    "sentence-transformers==5.6.1",
    "seqeval==1.2.2",
    "scikit-learn==1.9.0",
    # --- Vector store — Qdrant (primary) + FAISS (optional fallback) ---
    # qdrant-client pin khớp với Qdrant server trong Docker image (qdrant/qdrant:latest = 1.17.1).
    # Đổi version nếu nâng cấp Docker image (minor diff <= 1 là acceptable).
    "qdrant-client==1.17.1",
    "faiss-cpu>=1.7.0",       # giữ làm fallback offline; bỏ nếu muốn bắt buộc Qdrant
    # --- Embedding: deepx-embedding-v1 (pháp lý tiếng Việt, nDCG@10=0.816 Zalo Legal) ---
    # dùng qua sentence-transformers interface (không cần deepx-embed package riêng)
    # bkai-foundation-models/vietnamese-bi-encoder giữ làm model thứ 2 để so sánh
    # --- LLM (RAG+LLM — dùng có sẵn, không tự train) ---
    "anthropic==0.120.2",
    "python-dotenv==1.2.2",
    # --- Phân tích DL: trực quan hoá không gian embedding ---
    "umap-learn==0.5.12",
    # --- Templating / PDF export ---
    "jinja2==3.1.6",
    "weasyprint==69.0",
    "reportlab==5.0.0",
    # --- Storage / config ---
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "pyyaml==6.0.2",
    # --- REST API Backend (tuỳ chọn — phục vụ gọi API độc lập / Swagger UI) ---
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    # --- Data / GUI tables & charts ---
    "pandas==3.0.5",
    "matplotlib==3.11.1",
    # --- Utilities ---
    "python-dateutil==2.9.0.post0",
]

[project.optional-dependencies]
# OCR tuỳ chọn (không chạy được trên Windows CPU — xem requirements.txt và ingest/ocr.py)
ocr = ["vietocr==0.3.13", "torchvision==0.28.0"]
# Test
dev = ["pytest==9.1.1", "pytest-cov>=5.0"]
deepx = [
    "deepx-embed @ git+https://github.com/dx-tech-ai/deepx-embed.git",
    "einops>=0.8.0",
]

[tool.uv]
# uv dùng pyproject.toml làm nguồn truth duy nhất cho dependencies.
# Chạy `uv sync` để cài, `uv lock` để tạo/cập nhật lockfile.
# requirements.txt vẫn giữ cho tương thích ngược với Dockerfile pip-based.
#
# PyTorch CPU-only index — cần thêm khi resolve để tránh tải CUDA build (~3GB).
# index-strategy = unsafe-best-match cho phép uv tìm package từ nhiều index
# (cần thiết vì urllib3 xuất hiện cả ở PyPI và PyTorch index với version khác nhau).
index-url = "https://pypi.org/simple"
extra-index-url = ["https://download.pytorch.org/whl/cpu"]
index-strategy = "unsafe-best-match"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

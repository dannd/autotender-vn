services:
  # Qdrant Vector Database — chạy trước khi start app.
  # Dashboard UI: http://localhost:6333/dashboard
  # REST API:     http://localhost:6333
  qdrant:
    image: qdrant/qdrant:latest
    container_name: autotender-qdrant
    ports:
      - "6333:6333"   # REST API + Dashboard UI
      - "6334:6334"   # gRPC (dùng bởi qdrant-client khi grpc=True)
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Dedicated Embedding Model Serving Container (Microservice)
  # Phục vụ vector hóa văn bản (deepx-embedding-v1 / vi_bi_encoder)
  # REST API: http://localhost:8080/embed
  embedding-service:
    build:
      context: ./docker/embedding
      dockerfile: Dockerfile
    container_name: autotender-embedding-service
    ports:
      - "8080:8080"
    volumes:
      - hf_cache:/root/.cache/huggingface
    environment:
      - EMBEDDING_MODEL_KEY=deepx_v1
      - EMBEDDING_MODEL_NAME=dxtech-asia/deepx-embedding-v1
      - VECTOR_SIZE=1024
    restart: unless-stopped

  # Streamlit App — uncomment để chạy app trong container (tuỳ chọn).
  # Thông thường trong dev, chạy `streamlit run app/main.py` trực tiếp ngoài Docker
  # để reload nhanh hơn khi sửa code.
  #
  # app:
  #   build: .
  #   container_name: autotender-app
  #   ports:
  #     - "8501:8501"
  #   volumes:
  #     - app_data:/app/data/processed
  #   environment:
  #     - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
  #     - QDRANT_HOST=qdrant
  #     - QDRANT_PORT=6333
  #   depends_on:
  #     qdrant:
  #       condition: service_healthy
  #   restart: unless-stopped

volumes:
  qdrant_storage:
    # Data của Qdrant persist qua các lần restart container.
    # Xóa volume để reset toàn bộ collection: docker compose down -v
  hf_cache:
  app_data:

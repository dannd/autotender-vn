name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # paddleocr/paddlepaddle: OCR tuỳ chọn không có test nào dùng tới (xem
      # src/autotender/ingest/ocr.py — tự bỏ qua nếu thiếu); bỏ khỏi CI cho nhanh.
      - name: Install dependencies
        run: |
          grep -v -E '^(paddleocr|paddlepaddle)' requirements.txt > /tmp/requirements-ci.txt
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r /tmp/requirements-ci.txt

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-cache-${{ hashFiles('requirements.txt') }}
          restore-keys: hf-cache-

      - name: Run tests
        env:
          PYTHONUTF8: "1"
        run: pytest -q

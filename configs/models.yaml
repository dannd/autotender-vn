# Cấu hình cho từng module ML.
# ner/compliance: rule-based thuần (không có checkpoint/model — xem docs/MODEL_CARD.md
# về lý do đã bỏ khung 3-tier fine-tuned/zero-shot chưa từng dùng thật).
# generator/qa: vẫn giữ cơ chế 3-tier, tier 1 = Claude API (đường chính).

ner:
  labels: ["PACKAGE_NAME", "VALUE", "FUNDING", "METHOD", "CONTRACT_TYPE", "DURATION", "INVESTOR", "LOCATION"]

generator:
  claude_model: "claude-3-5-sonnet-20241022"
  # Phát hiện thực tế khi chạy live: 1536 không đủ cho mục dài (bảng điểm kỹ thuật,
  # nhiều điều khoản trích dẫn) — bị cắt cụt giữa câu, có nguy cơ mất nội dung/trích dẫn.
  max_tokens: 4096
  # Mang tính mô tả/tài liệu — phạm vi thật do models/generator.py::SECTION_DEFINITIONS quyết định.
  sections_supported: ["chuong_I", "chuong_II", "chuong_III", "chuong_IV", "chuong_V", "chuong_VI", "chuong_VII", "chuong_VIII"]

compliance:
  rule_codes: ["R1", "R2", "R3", "R4", "R5", "OK"]
  brand_dictionary: ["Cisco", "Dell", "HP", "Hewlett Packard", "Samsung", "IBM", "Lenovo", "Intel", "Microsoft", "Apple", "Huawei", "Sony", "Canon", "Epson", "Fujitsu", "Oracle", "SAP"]
  revenue_ratio_threshold: 3.0

# Module Hỏi-đáp RAG+LLM (Mức 1, đề cương RAG+LLM 15 ngày) — khác cơ chế 3-tier "tự train"
# ở trên: tier 1 = LLM Gateway / Claude API (đường chính), tier 2 = không dùng (dự phòng cho tương lai),
# tier 3 = liệt kê trích dẫn không qua LLM (luôn thành công, không cần API key).
qa:
  claude_model: "claude-3-5-sonnet-20241022"
  embedding_model_key: "vi_bi_encoder"
  candidate_k: 50
  top_k_citations: 5
  max_tokens: 1024
  # HyDE-lite: chuẩn hoá thuật ngữ câu hỏi bằng Claude Haiku TRƯỚC KHI truy hồi (chỉ Tier 1,
  # câu hỏi tự do từ người dùng — xem generation/query_rewrite.py). MẶC ĐỊNH TẮT: đo thật
  # trên 46 câu hỏi eval (`python scripts/run_retrieval_eval.py --rewrite`,
  # reports/retrieval_metrics_rewrite.json) cho thấy viết lại làm GIẢM chất lượng truy hồi ở
  # hầu hết chế độ (vd hybrid+rerank Recall@5 0.761→0.652, MRR 0.587→0.473) — xem
  # docs/DATA_CARD.md Mục 12.2 để biết lý do. Giữ tính năng lại (đã test) phòng khi áp dụng
  # cho câu hỏi khẩu ngữ/mơ hồ hơn tập eval hiện tại, nhưng KHÔNG bật mặc định vì đã đo hại.
  use_query_rewrite: false
  rewrite_model: "claude-haiku-4-5-20251001"
  # Metadata filtering theo loại văn bản (law_id) TRƯỚC KHI truy hồi — xem
  # generation/law_classifier.py. Oracle filter (biết trước đáp án) cho thấy TRẦN lợi ích lớn
  # (hybrid+rerank nDCG@5 0.627→0.734, MRR 0.587→0.707 trên 46 câu eval) — khác hẳn kết quả
  # tiêu cực của query rewrite. Đang đo bộ phân loại THẬT (`--classify-filter`) để quyết định
  # bật mặc định hay không — xem docs/DATA_CARD.md Mục 12.3 để biết kết quả cuối cùng.
  use_law_id_filter: false
  classifier_model: "claude-haiku-4-5-20251001"

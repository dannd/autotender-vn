# Cấu hình cho từng module ML — cơ chế 3-tier fallback (Mục 2.1)
# tier_1: checkpoint fine-tuned (models/*), tier_2: pretrained zero/few-shot, tier_3: rule-based

ner:
  tier1_checkpoint: "models/ner_phobert"
  tier2_model: "xlm-roberta-base"
  labels: ["PACKAGE_NAME", "VALUE", "FUNDING", "METHOD", "CONTRACT_TYPE", "DURATION", "INVESTOR", "LOCATION"]

generator:
  claude_model: "claude-sonnet-5"
  # Phát hiện thực tế khi chạy live: 1536 không đủ cho mục dài (bảng điểm kỹ thuật,
  # nhiều điều khoản trích dẫn) — bị cắt cụt giữa câu, có nguy cơ mất nội dung/trích dẫn.
  max_tokens: 4096
  sections_supported: ["chuong_III", "chuong_V"]

compliance:
  tier1_checkpoint: "models/compliance_xlmr"
  tier2_model: "xlm-roberta-base"
  rule_codes: ["R1", "R2", "R3", "R4", "R5", "OK"]
  brand_dictionary: ["Cisco", "Dell", "HP", "Hewlett Packard", "Samsung", "IBM", "Lenovo", "Intel", "Microsoft", "Apple", "Huawei", "Sony", "Canon", "Epson", "Fujitsu", "Oracle", "SAP"]
  revenue_ratio_threshold: 3.0

# Module Hỏi-đáp RAG+LLM (Mức 1, đề cương RAG+LLM 15 ngày) — khác cơ chế 3-tier "tự train"
# ở trên: tier 1 = Claude API (đường chính), tier 2 = không dùng (dự phòng cho tương lai),
# tier 3 = liệt kê trích dẫn không qua LLM (luôn thành công, không cần API key).
qa:
  claude_model: "claude-sonnet-5"
  embedding_model_key: "vi_bi_encoder"
  candidate_k: 50
  top_k_citations: 5
  max_tokens: 1024

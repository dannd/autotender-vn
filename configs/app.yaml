# Cấu hình chung cho ứng dụng AutoTender-VN
app:
  name: "AutoTender-VN"
  data_dir: "data"
  db_path: "data/processed/hitl.db"
  auth_db_path: "data/processed/auth.db"
  reports_dir: "reports"

sections_scope:
  # Phạm vi sinh dự thảo trong 1 tuần (Mục 6, M5): chỉ 2 chương khả thi
  - chuong_III   # Tiêu chuẩn đánh giá E-HSDT
  - chuong_V     # Yêu cầu về kỹ thuật / Phạm vi cung cấp

pdf_export:
  page_size: "A4"
  margin_top_mm: 20
  margin_bottom_mm: 20
  margin_left_mm: 30
  margin_right_mm: 20
  font_family: "Times New Roman"
  font_fallback: "Tinos"
  font_size_pt: 13
  draft_watermark: true
  page_numbers: true

# Cấu hình chung cho ứng dụng AutoTender-VN
app:
  name: "AutoTender-VN"
  data_dir: "data"
  db_path: "data/processed/hitl.db"
  auth_db_path: "data/processed/auth.db"
  audit_db_path: "data/processed/audit.db"
  reports_dir: "reports"

sections_scope:
  # Phạm vi sinh dự thảo — trọn bộ 8 chương I-VIII (xem
  # models/generator.py::SECTION_DEFINITIONS, nguồn thật sự điều khiển phạm vi; danh sách
  # này chỉ mang tính mô tả/tài liệu, không được code đọc trực tiếp).
  - chuong_I     # Chỉ dẫn nhà thầu
  - chuong_II    # Bảng dữ liệu đấu thầu
  - chuong_III   # Tiêu chuẩn đánh giá E-HSDT
  - chuong_IV    # Biểu mẫu mời thầu và dự thầu
  - chuong_V     # Yêu cầu về kỹ thuật / Phạm vi cung cấp
  - chuong_VI    # Điều kiện chung của hợp đồng
  - chuong_VII   # Điều kiện cụ thể của hợp đồng
  - chuong_VIII  # Biểu mẫu hợp đồng

# Vector DB — Qdrant (primary). Đọc host/port từ biến môi trường trước,
# fallback về giá trị dưới đây (phù hợp với docker-compose.yml mặc định).
qdrant:
  host: "localhost"      # ghi đè bằng QDRANT_HOST
  port: 6333             # ghi đè bằng QDRANT_PORT
  collection: "legal_chunks"   # ghi đè bằng QDRANT_COLLECTION
  # Timeout kết nối (giây) — tăng nếu Qdrant chạy trên máy chủ xa.
  timeout: 10

# Embedding model — deepx-embedding-v1 là mặc định vì được train
# đúng trên văn bản pháp lý tiếng Việt (nDCG@10 = 0.816 trên Zalo Legal benchmark)
# và hỗ trợ ngữ cảnh 8K token (không cần sliding-window workaround của vi_bi_encoder).
# Ghi đè bằng biến môi trường EMBEDDING_MODEL_KEY.
embedding:
  model_key: "deepx_v1"
  # Chiều vector của deepx-embedding-v1 ở chế độ Matryoshka mặc định (1024d).
  # Thay đổi nếu dùng model khác — phải trùng với collection đã tạo trong Qdrant.
  vector_size: 1024
  # Batch size khi embed — giảm nếu bị OOM trên máy ít RAM.
  batch_size: 32

claude_budget:
  usd_cap_per_process: 5.0
  pricing_usd_per_mtok:
    claude-sonnet-5:
      input_usd_per_mtok: 3.0
      output_usd_per_mtok: 15.0
    claude-haiku-4-5-20251001:
      input_usd_per_mtok: 1.0
      output_usd_per_mtok: 5.0

pdf_export:
  page_size: "A4"
  margin_top_mm: 20
  margin_bottom_mm: 20
  margin_left_mm: 30
  margin_right_mm: 20
  font_family: "Times New Roman"
  font_fallback: "Tinos"
  font_size_pt: 13
  draft_watermark: true
  page_numbers: true

